<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="840" height="540" rx="12" fill="#ffffff"/>

  <!-- Titre -->
  <text x="80" y="34" font-size="20" font-weight="700" fill="#111827">Coût cumulé d'un site vitrine : location vs propriété</text>
  <text x="80" y="58" font-size="13" fill="#6b7280">Tarifs constatés à Ajaccio en juin 2026 · location 49 €/mois vs site en propriété 2 000 € + frais courants</text>

  <!-- Grille horizontale -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="378" x2="800" y2="378"/>
    <line x1="80" y1="306" x2="800" y2="306"/>
    <line x1="80" y1="234" x2="800" y2="234"/>
    <line x1="80" y1="162" x2="800" y2="162"/>
    <line x1="80" y1="90" x2="800" y2="90"/>
  </g>

  <!-- Labels axe Y -->
  <g font-size="12" fill="#6b7280" text-anchor="end">
    <text x="72" y="382">1 000 €</text>
    <text x="72" y="310">2 000 €</text>
    <text x="72" y="238">3 000 €</text>
    <text x="72" y="166">4 000 €</text>
    <text x="72" y="94">5 000 €</text>
  </g>

  <!-- Axe X -->
  <line x1="80" y1="450" x2="800" y2="450" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="170" y="470">1 an</text>
    <text x="260" y="470">2 ans</text>
    <text x="350" y="470">3 ans</text>
    <text x="440" y="470">4 ans</text>
    <text x="530" y="470">5 ans</text>
    <text x="620" y="470">6 ans</text>
    <text x="710" y="470">7 ans</text>
    <text x="800" y="470">8 ans</text>
  </g>

  <!-- Fin d'engagement 48 mois -->
  <line x1="440" y1="90" x2="440" y2="450" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="440" y="82" font-size="11.5" fill="#6b7280" text-anchor="middle">fin d'engagement type (48 mois)</text>

  <!-- Ligne location : 0 € -> 4 704 € sur 96 mois -->
  <line x1="80" y1="450" x2="800" y2="111.3" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <!-- Ligne propriété : 2 000 € initial puis quasi plat -->
  <line x1="80" y1="450" x2="80" y2="306" stroke="#047857" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="round"/>
  <line x1="80" y1="306" x2="800" y2="277.2" stroke="#047857" stroke-width="3" stroke-linecap="round"/>

  <!-- Point de croisement -->
  <circle cx="414.6" cy="292.6" r="6" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <text x="404" y="330" font-size="13" font-weight="600" fill="#111827">≈ 3 ans ½ :</text>
  <text x="404" y="347" font-size="13" fill="#374151">la location devient plus chère</text>

  <!-- Étiquettes de fin -->
  <g font-size="13" font-weight="600">
    <text x="795" y="103" fill="#dc2626" text-anchor="end">Location : 4 704 € payés après 8 ans</text>
    <text x="795" y="125" font-size="12" font-weight="400" fill="#dc2626" text-anchor="end">vous ne possédez rien</text>
    <text x="795" y="300" fill="#047857" text-anchor="end">Propriété : ≈ 2 400 € après 8 ans</text>
    <text x="795" y="322" font-size="12" font-weight="400" fill="#047857" text-anchor="end">le site vous appartient</text>
  </g>

  <!-- Source -->
  <text x="80" y="520" font-size="11" fill="#9ca3af">Hypothèses : location 49 €/mois (offre constatée) · propriété : création 2 000 € HT + domaine et hébergement ≈ 50 €/an · davidbarbier.com</text>
</svg>
