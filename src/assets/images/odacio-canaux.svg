<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="400" rx="12" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="19" font-weight="600" fill="#0F172A">D'où viennent les visiteurs d'odacio-conseils.fr ?</text>
  <text x="40" y="70" font-size="13" fill="#64748B">Visites référées par canal, 6 derniers mois (hors accès directs) · source : Umami</text>

  <!-- barres : max 146 → 420px -->
  <g font-size="14">
    <text x="40" y="121" fill="#334155">Recherche Google + fiche</text>
    <rect x="240" y="106" width="420" height="22" rx="4" fill="#047857"/>
    <text x="668" y="122" fill="#0F172A" font-weight="600">146 · 64 %</text>

    <text x="40" y="169" fill="#334155">Facebook</text>
    <rect x="240" y="154" width="86" height="22" rx="4" fill="#047857"/>
    <text x="334" y="170" fill="#0F172A" font-weight="600">30 · 13 %</text>

    <text x="40" y="217" fill="#334155">Instagram</text>
    <rect x="240" y="202" width="60" height="22" rx="4" fill="#047857"/>
    <text x="308" y="218" fill="#0F172A" font-weight="600">21 · 9 %</text>

    <text x="40" y="265" fill="#334155">LinkedIn</text>
    <rect x="240" y="250" width="46" height="22" rx="4" fill="#047857"/>
    <text x="294" y="266" fill="#0F172A" font-weight="600">16 · 7 %</text>

    <text x="40" y="313" fill="#334155">Autres moteurs</text>
    <rect x="240" y="298" width="46" height="22" rx="4" fill="#047857"/>
    <text x="294" y="314" fill="#0F172A" font-weight="600">16 · 7 %</text>
  </g>

  <line x1="240" y1="96" x2="240" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="368" font-size="12" fill="#94A3B8">Aucun canal n'est seul en charge : la recherche domine, le social et le réseautage complètent.</text>
</svg>
